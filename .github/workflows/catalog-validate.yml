name: Validate Backstage Catalog

# Per-repo Backstage catalog validation. Self-contained — yamllint config is
# inlined so no cross-repo fetch is needed (smith-os is private; cross-repo
# actions/checkout requires a PAT and curl from raw.githubusercontent.com 404s).
#
# Two checks (defence in depth):
#   1. yamllint --strict           (formatting, indentation, line-length)
#   2. RoadieHQ entity-validator   (Backstage v1alpha1 schema conformance)
#
# Drift detection (workspace packages → catalog Components) runs centrally in
# smith-os via a scheduled workflow that clones each sibling repo and runs
# tools/architecture-artefacts/generate_catalog.py --check against it.
#
# Reference: Phase 7 Cluster E4 (2026-04-29)
# Source template: smith-os/blueprints/ci-templates/catalog-validate.yml

on:
  pull_request:
    paths:
      - 'catalog-info.yaml'
      - '.github/workflows/catalog-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'catalog-info.yaml'
      - '.github/workflows/catalog-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install --quiet yamllint

      - name: Write inlined yamllint config
        # Mirror of smith-os/.yamllint.yaml — inlined so this workflow has no
        # external dependency on smith-os (which is private).
        run: |
          cat > /tmp/yamllint.yaml <<'EOF'
          extends: default
          rules:
            line-length:
              max: 200
              level: warning
            document-start:
              present: true
            document-end:
              present: false
            truthy:
              allowed-values: ["true", "false"]
              check-keys: true
            indentation:
              spaces: 2
              indent-sequences: true
              check-multi-line-strings: false
          EOF

      - name: yamllint --strict (formatting)
        run: |
          yamllint --strict -c /tmp/yamllint.yaml catalog-info.yaml

      - name: RoadieHQ entity-validator (schema)
        # https://github.com/RoadieHQ/backstage-entity-validator
        run: |
          npx -y @roadiehq/backstage-entity-validator@latest catalog-info.yaml
