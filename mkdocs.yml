site_name: 'Skingenetix (CLIENT-003)'
site_url: https://mrsmithnl.github.io/skingenetix-website/

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  custom_dir: overrides

extra_css:
  - stylesheets/entity-nav.css

extra_javascript:
  - javascripts/entity-nav.js

extra:
  homepage: https://mrsmithnl.github.io/smith-ai-agency/

plugins:
  - search
  - encryptcontent:
      # The real password comes from the DOCS_PASSWORD env var. The fallback is a
      # deliberately non-secret placeholder: it keeps local `mkdocs build` working
      # and is long enough not to trip the plugin's low-entropy warning (which
      # aborts CI under --strict). Never publish a site built with the fallback.
      global_password:
        !ENV [DOCS_PASSWORD, 'placeholder-not-a-real-password-set-the-DOCS_PASSWORD-env-var-before-publishing']
      search_index: 'encrypted'
      remember_password: true
      session_storage: true

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Setup Steps: setup-steps.md
  - Architecture: architecture.md
  - Living Architecture (auto-generated):
      - C4 Architecture:
          - Index: architecture/generated/c4/README.md
          - System Context: architecture/generated/c4/system-context.md
          - Containers: architecture/generated/c4/containers.md
  - Strategy 2026:
      - 'Traffic & Performance Plan (2026-10-08)': website-traffic-and-performance-plan-2026-10-08.md
      - 'Review: Concept Pages (2026-10-08)': review-2026-10-08-concept-pages.md
      - 'Ranking Plan (2026-10-07)': seo-performance-and-ranking-plan-2026-10-07.md
      - Keyword Strategy: keyword-strategy-2026.md
      - Content & AI-Findability Strategy: content-hub-strategy-2026.md
      - Content Plan: content-plan-2026.md
      - Keyword Ownership Analysis (2026-09-30): keyword-ownership-analysis-2026-09-30.md
      - Study Page Template: study-page-template.md
      - 'Decision: Clinical Studies Blog': decision-clinical-studies-blog-2026-09-29.md
      - 'Review: Four New Study Articles (2026-10-01)': review-2026-10-01-four-new-study-drafts.md
  - Research:
      - Safety Notes on Study Articles: research-2026-09-30-safety-notes-on-study-articles.md
      - Study Hubs & Credibility: research-2026-study-hubs-credibility.md
      - AI Search & Content Hubs: research-2026-ai-search-and-content-hubs.md
      - First-Pass Keyword Research: keyword-research-2026-09-22.md
  - Audit Tracker: audits/tracker-skingenetix.com.md
  - Strategic OS: strategic-os.md
  - Metrics: metrics.md
  - Debt Metrics: debt-metrics.md
  - Processes & Flows: processes-and-flows.md
  - Decisions Log: decisions-log.md
  - Accounts & Access: accounts-and-access.md
  - Security Risk Log: security-risk-log.md
  - Todo: todo.md
  - Archive (superseded):
      - Content Strategy (pre-launch draft): content-strategy.md
      - SEO Strategy (pre-launch draft): seo-strategy.md
      - Handover 2026-05-06: handover-2026-05-06.md
